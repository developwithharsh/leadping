<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeadPing</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0C2D5E; }

    #app-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }

    #loading-screen {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0C2D5E;
      color: #fff;
      gap: 14px;
    }

    .lp-logo {
      font-size: 38px;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.7; transform: scale(0.95); }
    }

    .lp-brand {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .lp-dots {
      display: flex;
      gap: 6px;
    }

    .lp-dot {
      width: 7px;
      height: 7px;
      background: rgba(255,255,255,0.5);
      border-radius: 50%;
      animation: bounce 0.9s ease-in-out infinite;
    }
    .lp-dot:nth-child(2) { animation-delay: 0.18s; }
    .lp-dot:nth-child(3) { animation-delay: 0.36s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40%           { transform: translateY(-6px); opacity: 1; }
    }

    #offline-msg {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      color: rgba(255,255,255,0.7);
      text-align: center;
      padding: 0 24px;
    }
    #offline-msg .offline-icon { font-size: 32px; }
    #offline-msg button {
      margin-top: 6px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      border-radius: 8px;
      padding: 8px 20px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
    }
    #offline-msg button:hover { background: rgba(255,255,255,0.25); }
  </style>
</head>
<body>

  <div id="loading-screen">
    <div class="lp-logo">⚡</div>
    <div class="lp-brand">LeadPing</div>
    <div class="lp-dots">
      <div class="lp-dot"></div>
      <div class="lp-dot"></div>
      <div class="lp-dot"></div>
    </div>
  </div>

  <div id="offline-msg">
    <div class="offline-icon">📡</div>
    <div>Could not connect to LeadPing server.<br>Check your internet connection.</div>
    <button onclick="loadApp()">Retry</button>
  </div>

  <iframe id="app-frame" allow="clipboard-write"></iframe>

  <script src="../utils/storage.js"></script>
  <script>
    var BACKEND_URL = 'https://leadping-7y2w.onrender.com';
    var loadTimeout;

    function loadApp() {
      document.getElementById('offline-msg').style.display = 'none';
      document.getElementById('loading-screen').style.display = 'flex';
      document.getElementById('app-frame').style.display = 'none';

      chrome.storage.local.get(['user_id', 'tier', 'BACKEND_URL'], function(result) {
        var userId  = result.user_id || '';
        var tier    = result.tier || 'free';
        var backend = result.BACKEND_URL || BACKEND_URL;

        var url = backend + '/app?user_id=' + encodeURIComponent(userId) +
                  '&tier=' + encodeURIComponent(tier) +
                  '&backend=' + encodeURIComponent(backend);

        var frame = document.getElementById('app-frame');
        frame.src = url;

        // Timeout — show offline message if frame doesn't load in 12s
        loadTimeout = setTimeout(function() {
          document.getElementById('loading-screen').style.display = 'none';
          document.getElementById('offline-msg').style.display = 'flex';
        }, 12000);
      });
    }

    // iframe loaded successfully
    document.getElementById('app-frame').addEventListener('load', function() {
      clearTimeout(loadTimeout);
      document.getElementById('loading-screen').style.display = 'none';
      document.getElementById('offline-msg').style.display = 'none';
      document.getElementById('app-frame').style.display = 'block';
    });

    // Listen for messages from the iframe
    window.addEventListener('message', function(e) {
      var msg = e.data;
      if (!msg || !msg.type) return;

      if (msg.type === 'LP_OPEN_OPTIONS') {
        chrome.runtime.openOptionsPage();
      }

      if (msg.type === 'LP_GENERATE_AI') {
        chrome.runtime.sendMessage({
          type: 'GENERATE_AI_MESSAGE',
          user_id: msg.user_id,
          buyer_name: msg.buyer_name,
          product: msg.product,
          city: msg.city,
          company: msg.company,
          platform: msg.platform
        }, function(response) {
          document.getElementById('app-frame').contentWindow.postMessage({
            type: 'LP_AI_RESPONSE',
            lead_id: msg.lead_id,
            message: response && response.message ? response.message : ''
          }, '*');
        });
      }
    });

    // When storage changes (new leads detected), tell iframe to refresh
    chrome.storage.onChanged.addListener(function(changes, area) {
      if (area === 'local' && changes.leads) {
        var frame = document.getElementById('app-frame');
        if (frame && frame.contentWindow) {
          frame.contentWindow.postMessage({ type: 'LP_NEW_LEADS' }, '*');
        }
      }
    });

    // Start loading
    loadApp();
  </script>
</body>
</html>
